name: Changelog Bot

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: changelog-bot
  cancel-in-progress: false

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout changelogs
        uses: actions/checkout@v4
        with:
          path: changelogs
          fetch-depth: 0

      - name: Configure git identity
        working-directory: changelogs
        run: |
          git config user.name "changelog-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Clone tracked repos
        working-directory: changelogs
        env:
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: node scripts/sync-repos.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run Claude to update changelog
        uses: anthropics/claude-code-action@v1.0.193
        env:
          ANTHROPIC_MODEL: ${{ secrets.BEDROCK_MODEL_ID }}
        with:
          github_token: ${{ github.token }}
          use_bedrock: "true"
          show_full_output: "true"
          claude_args: |
            --max-turns 100
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            You are maintaining the changelog repo at ./changelogs (this is a git
            checkout of PewhProgrammer/changelogs, already on main, already has
            git user.name/user.email configured, already has the 4 tracked repos
            cloned as read-only siblings at ./work/kaizen.pewh, ./work/infra,
            ./work/stunning-doodle, ./work/rocky-agent). Run all commands below
            with ./changelogs as your working directory unless a path says
            otherwise.

            Read AGENTS.md in full and follow it exactly for entry format and
            commit conventions. Everything below is additional context specific
            to this automated run, and tells you how to apply AGENTS.md here,
            using a set of helper scripts instead of raw git commands so the
            bookkeeping stays consistent across a long run.

            For each of the 4 repos, in this order: kaizen.pewh, infra,
            stunning-doodle, rocky-agent:

            1. Run `node scripts/repo-diff.mjs <repo>`. It prints JSON:
               `{ repo, from, to, hasChanges, commits: [{ sha, author, date,
               subject, filesChanged }] }`. If `hasChanges` is false, run
               `node scripts/write-summary.mjs <repo> --skip "no new commits"`
               and move to the next repo.
            2. Actually inspect the commits and diffs (`git -C ../work/<repo>
               show <sha>` etc as needed) rather than judging from subject
               lines alone.
            3. Skip this repo entirely — write no file, make no commit — if the
               only new commits are, individually or collectively, not
               user-visible: dependency/lockfile bumps, CI/workflow config
               changes, merge commits with no substantive diff, formatting or
               lint-only changes, typo fixes with no behavior change,
               README/comment-only edits, or version-bump commits with no
               accompanying feature work. A quiet period where nothing shipped
               is the correct and expected outcome, do not manufacture an entry
               to have something to log. Under-reporting is safe here,
               inventing or padding content is not. If skipping, run
               `node scripts/write-summary.mjs <repo> --skip "<reason>"` and
               move to the next repo.
            4. If there is genuine user-visible shipped work (a new feature, a
               real bug fix affecting behavior, a meaningful improvement):
               a. Decide the bump type per AGENTS.md (feature work = minor, a
                  batch of small fixes = patch), then run
                  `node scripts/next-version.mjs <major|minor|patch>` to get
                  the version. Always use this script, never compute the
                  version by hand, it already accounts for entries written
                  earlier in this same run for other repos.
               b. Run `node scripts/new-entry.mjs <version>`, then fill in the
                  stub file it created: every field sourced from the real
                  commits only, "repo" set to the exact string "<repo>" as it
                  appears in the work/ directory name, and full commit SHAs in
                  "links" pointing to
                  https://github.com/PewhProgrammer/<repo>/commit/<sha>. Do not
                  attempt screenshots, "image" stays unset for this automated
                  run.
               c. Run `node scripts/build.mjs`. It must exit 0. If it doesn't,
                  fix the entry (never weaken validation) or abandon it if you
                  can't make it truthful and valid.
               d. If valid, commit it with `git add data/` and a commit message
                  in the style `feat: add <version> entry for <repo>`. Do not
                  run `git push`, something else handles that after you're
                  done.
               e. Run
                  `node scripts/write-summary.mjs <repo> --entry <version>`.

            Write the summary for each repo immediately after you finish
            processing it (step 1 or step 4e above), not saved up for the end.
            That way if you run out of turns partway through, the repos you
            did finish are still recorded correctly.

      - name: Update state file and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/changelog-run-summary.json"
          if [ ! -f "$summary" ]; then
            echo "No run summary found at $summary, nothing to update, exiting."
            exit 0
          fi

          node <<'EOF'
          const fs = require('fs');
          const summaryPath = process.env.RUNNER_TEMP + '/changelog-run-summary.json';
          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const statePath = 'changelogs/.changelog-state.json';
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          const { execSync } = require('child_process');
          const now = new Date().toISOString();

          for (const repo of Object.keys(state.repos)) {
            const headSha = execSync(`git -C work/${repo} rev-parse HEAD`).toString().trim();
            const result = summary[repo];
            state.repos[repo].lastProcessedSha = headSha;
            state.repos[repo].lastRunAt = now;
            state.repos[repo].lastResult = result
              ? (result.action === 'entry' ? `entry:${result.version}` : `skipped:${result.reason}`)
              : 'no-summary';
          }

          fs.writeFileSync(statePath, JSON.stringify(state, null, 2) + '\n');
          EOF

          cd changelogs
          git add .changelog-state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: update changelog-state after $(date -u +%Y-%m-%d) run"
          git push origin HEAD:main

      - name: Trigger site deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Changelog" --repo "${{ github.repository }}"
